<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#15142A">
  <title>Scratch to Reveal</title>
  <link rel="icon" href="data:,">
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #15142A; color: #fff;
      overflow: hidden; overscroll-behavior: none; touch-action: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, system-ui, sans-serif;
    }
    #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
            text-align: center; padding: 24px; box-sizing: border-box; font-size: 15px; opacity: .7; }
  </style>
  <!-- Sensors, audio, vibration and routing glue. Plain JS so the browser APIs stay readable. -->
  <script src="holo.js"></script>
</head>
<body>
  <div id="boot">Loading…</div>
  <script>
    // Kotlin/Wasm needs WasmGC: Chrome 119+, Firefox 120+, Safari 18.2+ (iOS 18.2+).
    window.addEventListener('error', function () {
      var boot = document.getElementById('boot');
      if (boot) boot.textContent = 'Could not start. This demo needs a browser with WebAssembly GC: Chrome 119+, Firefox 120+ or Safari / iOS 18.2+.';
    });
  </script>
  <script src="holoscratch.js"></script>
</body>
</html>
